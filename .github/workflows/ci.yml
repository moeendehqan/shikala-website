name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            BASE_DIR="/var/www/shikala-website"
            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"
            TOKEN="${{ secrets.GITHUB_TOKEN }}"

            mkdir -p "$BASE_DIR"
            cd "$BASE_DIR"

            # avoid permission issues when running from CI
            git config --global --add safe.directory "$BASE_DIR" || true

            if [ -d .git ]; then
              # update existing clone without storing token
              git fetch --depth=1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$BRANCH"
              git reset --hard FETCH_HEAD
            else
              # initialize and fetch branch, keep origin without token
              git init
              git remote add origin "https://github.com/${REPO}.git" || true
              git fetch --depth=1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$BRANCH"
              git checkout -f -B "$BRANCH" FETCH_HEAD
            fi

            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f