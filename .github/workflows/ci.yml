name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 1800s
          command_timeout: 1800s
          script_stop: true
          script: |
            set -euxo pipefail
            BASE_DIR="/var/www/shikala-website"
            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
            FETCH_URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"

            mkdir -p "$BASE_DIR"; cd "$BASE_DIR"
            git config --global --add safe.directory "$BASE_DIR" || true

            # detect docker compose v2 or fallback to docker-compose (inline to avoid non-zero break)
            if docker compose version >/dev/null 2>&1; then COMPOSE_CMD="docker compose"; elif command -v docker-compose >/dev/null 2>&1; then COMPOSE_CMD="docker-compose"; else echo "Docker Compose not found"; exit 1; fi

            # single-line conditional to avoid non-zero exit from test under script_stop
            if [ -d .git ]; then git fetch --depth=1 "$FETCH_URL" "$BRANCH" && git reset --hard FETCH_HEAD || true; else git init && git remote add origin "https://github.com/${REPO}.git" || true && git fetch --depth=1 "$FETCH_URL" "$BRANCH" && git checkout -f -B "$BRANCH" FETCH_HEAD || true; fi

            $COMPOSE_CMD -f docker-compose.prod.yml up -d --build
            docker image prune -f