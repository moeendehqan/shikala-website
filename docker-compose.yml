services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4080:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
    restart: unless-stopped
    # Uncomment the following lines to use .env values
    # env_file:
    #   - .env